<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHYSIX — Interactive Physics Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#04060f;
  --panel:#080c1a;
  --border:#0d1530;
  --glow:#00f5ff;
  --glow2:#ff006e;
  --glow3:#adff2f;
  --text:#c8e8ff;
  --muted:#3a5070;
  --font:'Orbitron',sans-serif;
  --mono:'Share Tech Mono',monospace;
}
html,body{height:100%;overflow:hidden;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  display:flex;flex-direction:column;
  user-select:none;
}

/* Scanline effect */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);
}

/* Header */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 24px;
  border-bottom:1px solid var(--border);
  background:rgba(8,12,26,0.95);
  backdrop-filter:blur(12px);
  flex-shrink:0;
  position:relative;
  z-index:10;
}
header::after{
  content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--glow),transparent);
  animation:scanH 4s linear infinite;
}
@keyframes scanH{0%{opacity:0.3}50%{opacity:1}100%{opacity:0.3}}

.logo{
  font-size:1.4rem;font-weight:900;letter-spacing:0.15em;
  color:var(--glow);
  text-shadow:0 0 20px var(--glow),0 0 40px rgba(0,245,255,0.3);
}
.logo span{color:var(--glow2);}

.sim-tabs{display:flex;gap:4px;}
.tab-btn{
  font-family:var(--font);font-size:0.6rem;font-weight:700;
  letter-spacing:0.1em;padding:8px 14px;
  background:transparent;border:1px solid var(--border);
  color:var(--muted);cursor:pointer;transition:all 0.2s;
  text-transform:uppercase;
}
.tab-btn:hover{border-color:var(--glow);color:var(--glow);}
.tab-btn.active{
  background:rgba(0,245,255,0.08);
  border-color:var(--glow);color:var(--glow);
  box-shadow:0 0 12px rgba(0,245,255,0.2),inset 0 0 12px rgba(0,245,255,0.05);
}

.header-stats{
  font-family:var(--mono);font-size:0.65rem;color:var(--muted);
  display:flex;gap:20px;
}
.stat{display:flex;flex-direction:column;align-items:flex-end;}
.stat-val{color:var(--glow3);font-size:0.8rem;}

/* Main layout */
main{display:flex;flex:1;overflow:hidden;}

/* Canvas area */
.canvas-wrap{flex:1;position:relative;overflow:hidden;}
canvas{display:block;width:100%;height:100%;}

.canvas-overlay{
  position:absolute;top:16px;left:16px;
  font-family:var(--mono);font-size:0.65rem;color:var(--muted);
  pointer-events:none;
  line-height:2;
}
.canvas-overlay .label{color:var(--glow);margin-right:8px;}

/* Controls panel */
.panel{
  width:240px;flex-shrink:0;
  background:var(--panel);
  border-left:1px solid var(--border);
  overflow-y:auto;
  display:flex;flex-direction:column;
  gap:0;
}
.panel::-webkit-scrollbar{width:4px;}
.panel::-webkit-scrollbar-track{background:transparent;}
.panel::-webkit-scrollbar-thumb{background:var(--border);}

.panel-section{
  padding:16px;
  border-bottom:1px solid var(--border);
}
.panel-title{
  font-size:0.55rem;letter-spacing:0.2em;
  color:var(--muted);margin-bottom:12px;
  text-transform:uppercase;
}

.control{margin-bottom:14px;}
.control label{
  font-family:var(--mono);font-size:0.65rem;
  color:var(--text);display:flex;justify-content:space-between;
  margin-bottom:6px;
}
.control label span{color:var(--glow3);}
input[type=range]{
  width:100%;-webkit-appearance:none;
  height:2px;background:var(--border);outline:none;
  border-radius:1px;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:12px;height:12px;
  border-radius:50%;background:var(--glow);cursor:pointer;
  box-shadow:0 0 8px var(--glow);
}

.action-btn{
  width:100%;font-family:var(--font);font-size:0.6rem;
  font-weight:700;letter-spacing:0.1em;
  padding:10px;margin-bottom:8px;
  background:transparent;border:1px solid var(--border);
  color:var(--muted);cursor:pointer;transition:all 0.2s;
  text-transform:uppercase;
}
.action-btn:hover{
  border-color:var(--glow2);color:var(--glow2);
  box-shadow:0 0 12px rgba(255,0,110,0.2);
}
.action-btn.primary{
  border-color:var(--glow3);color:var(--glow3);
  box-shadow:0 0 8px rgba(173,255,47,0.15);
}
.action-btn.primary:hover{
  background:rgba(173,255,47,0.08);
  box-shadow:0 0 20px rgba(173,255,47,0.3);
}

.info-box{
  font-family:var(--mono);font-size:0.65rem;
  color:var(--muted);line-height:1.8;
  padding:12px;background:rgba(0,0,0,0.3);
  border:1px solid var(--border);
}
.info-box b{color:var(--text);}

/* Hint */
.hint{
  position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  font-family:var(--mono);font-size:0.65rem;color:var(--muted);
  pointer-events:none;
  padding:6px 16px;background:rgba(8,12,26,0.8);
  border:1px solid var(--border);
  white-space:nowrap;
}
</style>
</head>
<body>

<header>
  <div class="logo">PHY<span>X</span>IS</div>
  <div class="sim-tabs">
    <button class="tab-btn active" onclick="switchSim('gravity')">Gravity</button>
    <button class="tab-btn" onclick="switchSim('pendulum')">Pendulum</button>
    <button class="tab-btn" onclick="switchSim('waves')">Waves</button>
    <button class="tab-btn" onclick="switchSim('gas')">Gas</button>
    <button class="tab-btn" onclick="switchSim('orbit')">Orbits</button>
  </div>
  <div class="header-stats">
    <div class="stat"><span style="font-size:0.55rem">FPS</span><span class="stat-val" id="fps">60</span></div>
    <div class="stat"><span style="font-size:0.55rem">OBJECTS</span><span class="stat-val" id="objcount">0</span></div>
    <div class="stat"><span style="font-size:0.55rem">TIME</span><span class="stat-val" id="simtime">0.0s</span></div>
  </div>
</header>

<main>
  <div class="canvas-wrap">
    <canvas id="c"></canvas>
    <div class="canvas-overlay" id="overlay"></div>
    <div class="hint" id="hint">Click to spawn • Right-click to remove</div>
  </div>

  <div class="panel" id="panel"></div>
</main>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, dpr;
let currentSim = null;
let animId;
let simTime = 0;
let frameCount = 0;
let lastFPS = performance.now();
let fps = 60;

function resize(){
  dpr = window.devicePixelRatio||1;
  const rect = canvas.parentElement.getBoundingClientRect();
  W = rect.width; H = rect.height;
  canvas.width = W*dpr; canvas.height = H*dpr;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.scale(dpr,dpr);
  if(currentSim && currentSim.onResize) currentSim.onResize();
}
window.addEventListener('resize', ()=>{ resize(); });
resize();

// ─────────────── UTILITIES ───────────────
const TAU = Math.PI*2;
function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}
function hsl(h,s,l,a=1){return `hsla(${h},${s}%,${l}%,${a})`;}

// ─────────────── RENDER LOOP ───────────────
function loop(){
  animId = requestAnimationFrame(loop);
  frameCount++;
  const now = performance.now();
  if(now - lastFPS > 500){
    fps = Math.round(frameCount*1000/(now-lastFPS));
    frameCount=0; lastFPS=now;
    document.getElementById('fps').textContent=fps;
  }

  ctx.clearRect(0,0,W,H);
  drawGrid();

  if(currentSim){
    simTime += 1/60;
    document.getElementById('simtime').textContent=simTime.toFixed(1)+'s';
    currentSim.update();
    currentSim.draw();
    if(currentSim.getOverlay) document.getElementById('overlay').innerHTML = currentSim.getOverlay();
    if(currentSim.getCount !== undefined) document.getElementById('objcount').textContent = currentSim.getCount();
  }
}

function drawGrid(){
  const gsize = 40;
  ctx.strokeStyle='rgba(13,21,48,0.8)';
  ctx.lineWidth=1;
  for(let x=0;x<W;x+=gsize){
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
  }
  for(let y=0;y<H;y+=gsize){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }
}

// ─────────────── CANVAS EVENTS ───────────────
canvas.addEventListener('click', e=>{
  const r = canvas.getBoundingClientRect();
  if(currentSim && currentSim.onClick) currentSim.onClick(e.clientX-r.left, e.clientY-r.top);
});
canvas.addEventListener('contextmenu', e=>{
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  if(currentSim && currentSim.onRightClick) currentSim.onRightClick(e.clientX-r.left, e.clientY-r.top);
});
canvas.addEventListener('mousemove', e=>{
  const r = canvas.getBoundingClientRect();
  if(currentSim && currentSim.onMouseMove) currentSim.onMouseMove(e.clientX-r.left, e.clientY-r.top);
});

// ─────────────── GLOWING TEXT ───────────────
function glowText(text, x, y, color='#00f5ff', size=12){
  ctx.save();
  ctx.font = `${size}px 'Share Tech Mono'`;
  ctx.fillStyle=color;
  ctx.shadowColor=color;
  ctx.shadowBlur=12;
  ctx.fillText(text,x,y);
  ctx.restore();
}

function glowCircle(x, y, r, color, alpha=1, blur=15){
  ctx.save();
  ctx.beginPath();
  ctx.arc(x,y,r,0,TAU);
  const g = ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0, color.replace(')',`,${alpha})`).replace('rgb(','rgba(').replace('hsl','hsla'));
  g.addColorStop(1, 'transparent');
  ctx.fillStyle = g;
  ctx.shadowColor=color; ctx.shadowBlur=blur;
  ctx.fill();
  ctx.restore();
}

function drawBall(x, y, r, color, trail=[]){
  // Trail
  for(let i=0;i<trail.length;i++){
    const t = i/trail.length;
    const p = trail[i];
    ctx.beginPath();
    ctx.arc(p.x,p.y,r*t*0.7,0,TAU);
    ctx.fillStyle=color.replace('1)',''+t*0.3+')');
    ctx.fill();
  }
  // Glow
  ctx.save();
  ctx.beginPath();ctx.arc(x,y,r*2.5,0,TAU);
  const grd = ctx.createRadialGradient(x,y,0,x,y,r*2.5);
  grd.addColorStop(0,color.replace('1)','0.3)'));
  grd.addColorStop(1,'transparent');
  ctx.fillStyle=grd; ctx.fill();
  // Core
  ctx.beginPath();ctx.arc(x,y,r,0,TAU);
  ctx.fillStyle=color;
  ctx.shadowColor=color;ctx.shadowBlur=20;
  ctx.fill();
  // Highlight
  ctx.beginPath();ctx.arc(x-r*0.3,y-r*0.3,r*0.3,0,TAU);
  ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.shadowBlur=0; ctx.fill();
  ctx.restore();
}

// ════════════════════════════════
//  SIM 1: GRAVITY / PARTICLES
// ════════════════════════════════
const gravSim = {
  balls: [],
  gravity: 500,
  restitution: 0.75,
  friction: 0.98,
  ballRadius: 14,
  mouseX:0,mouseY:0,

  init(){
    this.balls=[];
    for(let i=0;i<12;i++) this.spawnRandom();
  },
  spawnRandom(){
    const colors=['rgba(0,245,255,1)','rgba(255,0,110,1)','rgba(173,255,47,1)','rgba(255,165,0,1)','rgba(200,100,255,1)'];
    this.balls.push({
      x:rnd(50,W-50), y:rnd(50,H/2),
      vx:rnd(-200,200), vy:rnd(-100,100),
      r: rnd(8,20),
      color: colors[Math.floor(rnd(0,colors.length))],
      trail:[], mass:1
    });
  },
  onClick(x,y){
    const colors=['rgba(0,245,255,1)','rgba(255,0,110,1)','rgba(173,255,47,1)','rgba(255,165,0,1)','rgba(200,100,255,1)'];
    this.balls.push({
      x,y,vx:rnd(-150,150),vy:-200,
      r:rnd(8,20),
      color:colors[Math.floor(rnd(0,colors.length))],
      trail:[],mass:1
    });
  },
  onRightClick(x,y){
    let closest=-1,minD=Infinity;
    this.balls.forEach((b,i)=>{
      const d=Math.hypot(b.x-x,b.y-y);
      if(d<minD){minD=d;closest=i;}
    });
    if(closest>=0) this.balls.splice(closest,1);
  },
  onMouseMove(x,y){this.mouseX=x;this.mouseY=y;},

  update(){
    const dt=1/60;
    const g=this.gravity;
    const e=this.restitution;

    this.balls.forEach(b=>{
      b.trail.push({x:b.x,y:b.y});
      if(b.trail.length>12) b.trail.shift();

      b.vy += g*dt;
      b.vx *= this.friction;
      b.x += b.vx*dt;
      b.y += b.vy*dt;

      // Floor
      if(b.y+b.r > H-2){
        b.y=H-2-b.r; b.vy*=-e;
        b.vx*=0.92;
        if(Math.abs(b.vy)<20) b.vy=0;
      }
      // Ceiling
      if(b.y-b.r<0){b.y=b.r;b.vy*=-e;}
      // Walls
      if(b.x-b.r<0){b.x=b.r;b.vx*=-e;}
      if(b.x+b.r>W){b.x=W-b.r;b.vx*=-e;}
    });

    // Ball-ball collision
    for(let i=0;i<this.balls.length;i++){
      for(let j=i+1;j<this.balls.length;j++){
        const a=this.balls[i], b=this.balls[j];
        const dx=b.x-a.x, dy=b.y-a.y;
        const dist=Math.hypot(dx,dy);
        const minD=a.r+b.r;
        if(dist<minD && dist>0){
          const nx=dx/dist, ny=dy/dist;
          const overlap=(minD-dist)/2;
          a.x-=nx*overlap; a.y-=ny*overlap;
          b.x+=nx*overlap; b.y+=ny*overlap;
          const dvx=a.vx-b.vx, dvy=a.vy-b.vy;
          const dot=dvx*nx+dvy*ny;
          if(dot>0){
            a.vx-=dot*nx*e; a.vy-=dot*ny*e;
            b.vx+=dot*nx*e; b.vy+=dot*ny*e;
          }
        }
      }
    }
  },

  draw(){
    // Floor line
    ctx.save();
    ctx.strokeStyle='rgba(0,245,255,0.2)';
    ctx.lineWidth=1;
    ctx.setLineDash([4,8]);
    ctx.beginPath();ctx.moveTo(0,H-2);ctx.lineTo(W,H-2);ctx.stroke();
    ctx.restore();

    this.balls.forEach(b=>{
      drawBall(b.x,b.y,b.r,b.color,b.trail);
    });

    // Speed indicators
    this.balls.forEach(b=>{
      const spd=Math.hypot(b.vx,b.vy);
      if(spd>50){
        ctx.save();
        ctx.strokeStyle=b.color.replace('1)','0.5)');
        ctx.lineWidth=2;
        ctx.shadowColor=b.color;ctx.shadowBlur=8;
        ctx.beginPath();
        ctx.moveTo(b.x,b.y);
        ctx.lineTo(b.x+b.vx*0.04, b.y+b.vy*0.04);
        ctx.stroke();
        ctx.restore();
      }
    });
  },
  getCount(){return this.balls.length;},
  getOverlay(){
    const totalKE = this.balls.reduce((s,b)=>s+0.5*b.mass*(b.vx**2+b.vy**2),0);
    return `<span class="label">SIM</span> Gravity Bounce<br><span class="label">g</span> ${this.gravity} m/s²<br><span class="label">KE</span> ${Math.round(totalKE)} J<br><span class="label">e</span> ${this.restitution}`;
  },
  buildPanel(){
    return `
    <div class="panel-section">
      <div class="panel-title">▸ Physics</div>
      <div class="control"><label>Gravity <span id="gv">500</span></label><input type="range" min="0" max="1500" value="500" oninput="gravSim.gravity=+this.value;document.getElementById('gv').textContent=this.value"></div>
      <div class="control"><label>Restitution <span id="rv">0.75</span></label><input type="range" min="0" max="100" value="75" oninput="gravSim.restitution=this.value/100;document.getElementById('rv').textContent=(this.value/100).toFixed(2)"></div>
      <div class="control"><label>Friction <span id="fv">0.98</span></label><input type="range" min="50" max="100" value="98" oninput="gravSim.friction=this.value/100;document.getElementById('fv').textContent=(this.value/100).toFixed(2)"></div>
    </div>
    <div class="panel-section">
      <div class="panel-title">▸ Actions</div>
      <button class="action-btn primary" onclick="for(let i=0;i<5;i++) gravSim.spawnRandom()">+ Spawn 5 Balls</button>
      <button class="action-btn" onclick="gravSim.balls.forEach(b=>{b.vy=-600;b.vx=rnd(-300,300)})">Explode!</button>
      <button class="action-btn" onclick="gravSim.balls=[]">Clear All</button>
      <button class="action-btn" onclick="gravSim.init()">Reset</button>
    </div>
    <div class="panel-section">
      <div class="panel-title">▸ Info</div>
      <div class="info-box">
        <b>Elastic Collisions</b><br>
        F = ma<br>
        KE = ½mv²<br>
        e = v_after / v_before<br><br>
        Click canvas to<br>add balls. Right-click<br>to remove nearest.
      </div>
    </div>`;
  }
};

// ════════════════════════════════
//  SIM 2: DOUBLE PENDULUM
// ════════════════════════════════
const pendulumSim = {
  pendulums:[],
  trailLength:400,
  showTrail:true,
  paused:false,

  init(){
    this.pendulums=[];
    this.addPendulum(W/2, H*0.12, Math.PI/3+0.1, Math.PI/2+0.2, '#00f5ff');
    this.addPendulum(W/2+5, H*0.12, Math.PI/3, Math.PI/2, '#ff006e');
  },
  addPendulum(ox,oy,a1,a2,color){
    this.pendulums.push({
      ox,oy,
      L1:140, L2:140,
      M1:15, M2:15,
      a1, a2,
      v1:0, v2:0,
      color, trail:[],
      trailHue: color==='#00f5ff'?180:330
    });
  },
  onClick(x,y){
    const colors=['#00f5ff','#ff006e','#adff2f','#ff8c00'];
    const c=colors[this.pendulums.length%colors.length];
    this.addPendulum(x,H*0.12,rnd(-Math.PI,Math.PI),rnd(-Math.PI,Math.PI),c);
  },
  onRightClick(){
    if(this.pendulums.length>1) this.pendulums.pop();
  },
  update(){
    if(this.paused) return;
    const g=9.81*50;
    const dt=1/120;
    const steps=4;
    const dtS=dt/steps;

    this.pendulums.forEach(p=>{
      for(let s=0;s<steps;s++){
        const {a1,a2,v1,v2,L1,L2,M1,M2}=p;
        const da=a1-a2;
        const denom1=(M1+M2)*L1 - M2*L1*Math.cos(da)**2;
        const denom2=(L2/L1)*denom1;
        const a1acc = (M2*L1*v1**2*Math.sin(da)*Math.cos(da) + M2*g*Math.sin(a2)*Math.cos(da) + M2*L2*v2**2*Math.sin(da) - (M1+M2)*g*Math.sin(a1)) / denom1;
        const a2acc = (-M2*L2*v2**2*Math.sin(da)*Math.cos(da) + (M1+M2)*g*Math.sin(a1)*Math.cos(da) - (M1+M2)*L1*v1**2*Math.sin(da) - (M1+M2)*g*Math.sin(a2)) / denom2;
        p.v1 += a1acc*dtS; p.v2 += a2acc*dtS;
        p.a1 += p.v1*dtS; p.a2 += p.v2*dtS;
        p.v1*=0.9999; p.v2*=0.9999;
      }
      const ox=p.ox, oy=p.oy;
      const x1=ox+p.L1*Math.sin(p.a1);
      const y1=oy+p.L1*Math.cos(p.a1);
      const x2=x1+p.L2*Math.sin(p.a2);
      const y2=y1+p.L2*Math.cos(p.a2);
      p.trail.push({x:x2,y:y2});
      if(p.trail.length>this.trailLength) p.trail.shift();
    });
  },
  draw(){
    // Pivot glow
    this.pendulums.forEach(p=>{
      ctx.save();
      ctx.beginPath();ctx.arc(p.ox,p.oy,5,0,TAU);
      ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=20;
      ctx.fill();ctx.restore();

      // Trail
      if(this.showTrail && p.trail.length>1){
        ctx.save();
        for(let i=1;i<p.trail.length;i++){
          const t=i/p.trail.length;
          ctx.beginPath();
          ctx.moveTo(p.trail[i-1].x,p.trail[i-1].y);
          ctx.lineTo(p.trail[i].x,p.trail[i].y);
          ctx.strokeStyle=p.color.replace(')',`, ${t*0.8})`).replace('#','rgba(').replace('00f5ff','0,245,255').replace('ff006e','255,0,110').replace('adff2f','173,255,47').replace('ff8c00','255,140,0');
          ctx.lineWidth=t*2.5;
          ctx.shadowColor=p.color; ctx.shadowBlur=t*8;
          ctx.stroke();
        }
        ctx.restore();
      }

      // Arms & bobs
      const ox=p.ox,oy=p.oy;
      const x1=ox+p.L1*Math.sin(p.a1);
      const y1=oy+p.L1*Math.cos(p.a1);
      const x2=x1+p.L2*Math.sin(p.a2);
      const y2=y1+p.L2*Math.cos(p.a2);

      ctx.save();
      ctx.strokeStyle=p.color; ctx.lineWidth=2;
      ctx.shadowColor=p.color; ctx.shadowBlur=8;
      ctx.globalAlpha=0.6;
      ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(x1,y1);
      ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
      ctx.stroke(); ctx.restore();

      drawBall(x1,y1,p.M1,p.color.replace(/^#/,'').length===6?`rgba(${parseInt(p.color.slice(1,3),16)},${parseInt(p.color.slice(3,5),16)},${parseInt(p.color.slice(5,7),16)},1)`:p.color);
      drawBall(x2,y2,p.M2,p.color.replace(/^#/,'').length===6?`rgba(${parseInt(p.color.slice(1,3),16)},${parseInt(p.color.slice(3,5),16)},${parseInt(p.color.slice(5,7),16)},1)`:p.color);
    });
  },
  getCount(){return this.pendulums.length;},
  getOverlay(){
    const p=this.pendulums[0];
    if(!p) return '';
    const E = 0.5*(p.M1+p.M2)*p.L1**2*p.v1**2 + 0.5*p.M2*p.L2**2*p.v2**2;
    return `<span class="label">SIM</span> Double Pendulum<br><span class="label">ω₁</span> ${p.v1.toFixed(2)} rad/s<br><span class="label">ω₂</span> ${p.v2.toFixed(2)} rad/s<br><span class="label">KE</span> ${Math.round(E)} J<br><span class="label">MODE</span> CHAOTIC`;
  },
  buildPanel(){
    return `
    <div class="panel-section">
      <div class="panel-title">▸ Parameters</div>
      <div class="control"><label>Trail Length <span id="tl">400</span></label><input type="range" min="10" max="800" value="400" oninput="pendulumSim.trailLength=+this.value;document.getElementById('tl').textContent=this.value"></div>
      <div class="control"><label>Bob Size <span id="bs">15</span></label><input type="range" min="5" max="40" value="15" oninput="pendulumSim.pendulums.forEach(p=>{p.M1=+this.value;p.M2=+this.value});document.getElementById('bs').textContent=this.value"></div>
      <div class="control"><label>Arm Length <span id="al">140</span></label><input type="range" min="60" max="250" value="140" oninput="pendulumSim.pendulums.forEach(p=>{p.L1=+this.value;p.L2=+this.value});pendulumSim.pendulums.forEach(p=>p.trail=[]);document.getElementById('al').textContent=this.value"></div>
    </div>
    <div class="panel-section">
      <div class="panel-title">▸ Actions</div>
      <button class="action-btn primary" onclick="pendulumSim.pendulums.forEach(p=>{p.trail=[]})">Clear Trails</button>
      <button class="action-btn" onclick="pendulumSim.paused=!pendulumSim.paused;this.textContent=pendulumSim.paused?'▶ Resume':'⏸ Pause'">⏸ Pause</button>
      <button class="action-btn" onclick="pendulumSim.pendulums.forEach(p=>{p.v1=rnd(-5,5);p.v2=rnd(-5,5)})">Random Kick</button>

const wavesSim = {
  sources:[],
  frequency:2,
  amplitude:60,
  speed:200,
  resolution:8,
  showPhase:false,

  init(){
    this.sources=[
      {x:W*0.35, y:H*0.5, phase:0},
      {x:W*0.65, y:H*0.5, phase:0}
    ];
  },
  onClick(x,y){ this.sources.push({x,y,phase:rnd(0,TAU)}); },
  onRightClick(x,y){
    let ci=-1,md=Infinity;
    this.sources.forEach((s,i)=>{const d=Math.hypot(s.x-x,s.y-y);if(d<md){md=d;ci=i;}});
    if(ci>=0 && this.sources.length>1) this.sources.splice(ci,1);
  },
  update(){
    this.sources.forEach(s=>{
      s.phase += this.frequency*0.08;
    });
  },
  draw(){
    const res = this.resolution;
    const cols = Math.ceil(W/res);
    const rows = Math.ceil(H/res);

    for(let i=0;i<cols;i++){
      for(let j=0;j<rows;j++){
        const px = i*res + res/2;
        const py = j*res + res/2;

        let val=0;
        this.sources.forEach(s=>{
          const d = Math.hypot(px-s.x, py-s.y);
          const phase = d/this.speed*this.frequency*60 - s.phase;
          val += Math.sin(phase) * this.amplitude / (1+d*0.015);
        });
        val = clamp(val/this.sources.length, -1, 1);

        let r,g,b;
        if(val>0){
          r=0; g=Math.round(val*245); b=Math.round(val*255);
        } else {
          const v=-val;
          r=Math.round(v*255); g=0; b=Math.round(v*110);
        }
        ctx.fillStyle=`rgb(${r},${g},${b})`;
        ctx.fillRect(i*res, j*res, res, res);
      }
    }

    // Source dots
    this.sources.forEach((s,i)=>{
      ctx.save();
      ctx.beginPath();ctx.arc(s.x,s.y,12,0,TAU);
      ctx.fillStyle='rgba(255,255,255,0.9)';
      ctx.shadowColor='white';ctx.shadowBlur=20;
      ctx.fill();
      ctx.fillStyle='#000';ctx.font='bold 10px Orbitron';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(i+1,s.x,s.y);
      ctx.restore();
      // Ripple
      const ripR = (s.phase*30)%200;
      ctx.save();
      ctx.beginPath();ctx.arc(s.x,s.y,ripR,0,TAU);
      ctx.strokeStyle=`rgba(255,255,255,${1-ripR/200})`;
      ctx.lineWidth=1.5;ctx.stroke();
      ctx.restore();
    });
  },
  getCount(){return this.sources.length;},
  getOverlay(){
    return `<span class="label">SIM</span> Wave Interference<br><span class="label">f</span> ${this.frequency.toFixed(1)} Hz<br><span class="label">A</span> ${this.amplitude}<br><span class="label">v</span> ${this.speed} m/s`;
  },
  buildPanel(){
    return `
    <div class="panel-section">
      <div class="panel-title">▸ Wave Properties</div>
      <div class="control"><label>Frequency <span id="wf">2.0</span></label><input type="range" min="1" max="80" value="20" oninput="wavesSim.frequency=this.value/10;document.getElementById('wf').textContent=wavesSim.frequency.toFixed(1)"></div>
      <div class="control"><label>Amplitude <span id="wa">60</span></label><input type="range" min="10" max="100" value="60" oninput="wavesSim.amplitude=+this.value;document.getElementById('wa').textContent=this.value"></div>
      <div class="control"><label>Speed <span id="ws">200</span></label><input type="range" min="50" max="600" value="200" oninput="wavesSim.speed=+this.value;document.getElementById('ws').textContent=this.value"></div>
      <div class="control"><label>Resolution <span id="wr">8</span></label><input type="range" min="4" max="20" value="8" oninput="wavesSim.resolution=+this.value;document.getElementById('wr').textContent=this.value"></div>
    </div>
    <div class="panel-section">
      <div class="panel-title">▸ Actions</div>
      <button class="action-btn primary" onclick="wavesSim.sources.forEach((s,i)=>{s.x=W*(0.25+i*0.25);s.y=H/2})">Align Sources</button>
      <button class="action-btn" onclick="wavesSim.sources.forEach(s=>s.phase=rnd(0,6.28))">Random Phase</button>
      <button class="action-btn" onclick="wavesSim.init()">Reset</button>
    </div>
    <div class="panel-section">
      <div class="panel-title">▸ Info</div>
      <div class="info-box">
        <b>Huygens Principle</b><br>
        Cyan = constructive<br>Red = destructive<br>interference<br><br>
        λ = v / f<br>
        Drag sources to<br>change patterns.
      </div>
    </div>`;
  }
};

const gasSim = {
  particles:[],
  temp:300,
  pressure:0,
  pressureHistory:[],
  wallBounces:0,

  init(){
    this.particles=[];
    this.pressure=0;
    for(let i=0;i<80;i++) this.spawn();
  },
  spawn(){
    const speed = Math.sqrt(this.temp)*3;
    const angle = rnd(0,TAU);
    this.particles.push({
      x:rnd(20,W-20), y:rnd(20,H-20),
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,
      r:4,
      color:`hsl(${rnd(160,220)},100%,60%)`
    });
  },
  onClick(x,y){
    const speed=Math.sqrt(this.temp)*3;
    const angle=rnd(0,TAU);
    this.particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,r:4,color:`hsl(${rnd(160,220)},100%,60%)`});
  },
  onRightClick(){if(this.particles.length>0) this.particles.pop();},
  update(){
    const dt=1/60;
    let bounces=0;
    this.particles.forEach(p=>{
      p.x+=p.vx*dt; p.y+=p.vy*dt;
      if(p.x-p.r<0){p.x=p.r;p.vx*=-1;bounces++;}
      if(p.x+p.r>W){p.x=W-p.r;p.vx*=-1;bounces++;}
      if(p.y-p.r<0){p.y=p.r;p.vy*=-1;bounces++;}
      if(p.y+p.r>H){p.y=H-p.r;p.vy*=-1;bounces++;}

      // Thermostat
      const speed=Math.hypot(p.vx,p.vy);
      const target=Math.sqrt(this.temp)*3;
      const factor=lerp(1,target/speed,0.05);
      p.vx*=factor; p.vy*=factor;
      // Color by speed
      const t=clamp(speed/(target*2),0,1);
      p.color=`hsl(${lerp(180,0,t)},100%,${lerp(50,70,t)}%)`;
    });
    this.pressure = bounces*this.temp*0.01;
    this.pressureHistory.push(this.pressure);
    if(this.pressureHistory.length>120) this.pressureHistory.shift();
  },
  draw(){
    // Box walls glow
    ctx.save();
    ctx.strokeStyle='rgba(0,245,255,0.3)';
    ctx.lineWidth=2;
    ctx.shadowColor='#00f5ff';ctx.shadowBlur=12;
    ctx.strokeRect(1,1,W-2,H-2);
    ctx.restore();

    this.particles.forEach(p=>{
      ctx.save();
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);
      ctx.fillStyle=p.color;
      ctx.shadowColor=p.color;ctx.shadowBlur=8;
      ctx.fill();ctx.restore();
    });

    // Pressure graph
    const gh=80,gw=180,gx=W-gw-16,gy=H-gh-16;
    ctx.save();
    ctx.fillStyle='rgba(8,12,26,0.8)';
    ctx.fillRect(gx-8,gy-20,gw+16,gh+28);
    ctx.strokeStyle='rgba(0,245,255,0.2)';
    ctx.strokeRect(gx-8,gy-20,gw+16,gh+28);
    glowText('PRESSURE',gx,gy-6,'#00f5ff',9);
    if(this.pressureHistory.length>2){
      const max=Math.max(...this.pressureHistory,1);
      ctx.beginPath();
      ctx.strokeStyle='#adff2f';ctx.lineWidth=1.5;
      ctx.shadowColor='#adff2f';ctx.shadowBlur=6;
      this.pressureHistory.forEach((v,i)=>{
        const px2=gx+i*(gw/120);
        const py2=gy+gh-v/max*gh;
        i===0?ctx.moveTo(px2,py2):ctx.lineTo(px2,py2);
      });
      ctx.stroke();
    }
    ctx.restore();
  },
  getCount(){return this.particles.length;},
  getOverlay(){
    const avgSpeed=this.particles.length>0?this.particles.reduce((s,p)=>s+Math.hypot(p.vx,p.vy),0)/this.particles.length:0;
    return `<span class="label">SIM</span> Ideal Gas<br><span class="label">T</span> ${this.temp} K<br><span class="label">N</span> ${this.particles.length}<br><span class="label">v̄</span> ${Math.round(avgSpeed)} m/s<br><span class="label">P</span> ${this.pressure.toFixed(1)} Pa`;
  },
  buildPanel(){
    return `
    <div class="panel-section">
      <div class="panel-title">▸ Thermodynamics</div>
      <div class="control"><label>Temperature <span id="gt">${this.temp}</span> K</label><input type="range" min="50" max="2000" value="300" oninput="gasSim.temp=+this.value;document.getElementById('gt').textContent=this.value"></div>
    </div>
    <div class="panel-section">
      <div class="panel-title">▸ Actions</div>
      <button class="action-btn primary" onclick="for(let i=0;i<20;i++) gasSim.spawn()">+ 20 Particles</button>
      <button class="action-btn" onclick="gasSim.particles=gasSim.particles.slice(0,Math.max(0,gasSim.particles.length-20))">- 20 Particles</button>
      <button class="action-btn" onclick="gasSim.temp=50;document.querySelector('#gt').textContent=50;document.querySelector('input[type=range]').value=50">Freeze</button>
      <button class="action-btn" onclick="gasSim.init()">Reset</button>
    </div>
    <div class="panel-section">
      <div class="panel-title">▸ Info</div>
      <div class="info-box">
        <b>Kinetic Theory</b><br>
        PV = NkT<br>
        KE = ³⁄₂ kT<br><br>
        Color = speed<br>Blue→Red = slow→fast<br><br>
        Pressure graph<br>shown bottom-right.
      </div>
    </div>`;
  }
};

const orbitSim = {
  bodies:[],
  G:6000,
  trails:true,

  init(){
    this.bodies=[
      {x:W/2, y:H/2, vx:0, vy:0, m:5000, r:18, color:'rgba(255,220,50,1)', trail:[], fixed:true, name:'Star'},
      {x:W/2+180, y:H/2, vx:0, vy:-Math.sqrt(6000*5000/180), m:30, r:7, color:'rgba(50,200,255,1)', trail:[], name:'Planet'},
      {x:W/2+280, y:H/2, vx:0, vy:-Math.sqrt(6000*5000/280), m:8, r:5, color:'rgba(255,120,50,1)', trail:[], name:'Planet 2'},
      {x:W/2-220, y:H/2, vx:0, vy:Math.sqrt(6000*5000/220)*0.95, m:50, r:10, color:'rgba(100,255,150,1)', trail:[], name:'Giant'},
    ];
  },
  onClick(x,y){
    const colors=['rgba(255,100,100,1)','rgba(100,255,200,1)','rgba(200,100,255,1)','rgba(255,200,100,1)'];
    const c=colors[this.bodies.length%colors.length];
    // Orbital velocity
    const dx=x-this.bodies[0].x, dy=y-this.bodies[0].y;
    const d=Math.hypot(dx,dy);
    const ov=Math.sqrt(this.G*this.bodies[0].m/d);
    this.bodies.push({
      x,y,
      vx: -dy/d*ov, vy: dx/d*ov,
      m:15, r:6, color:c, trail:[]
    });
  },
  onRightClick(x,y){
    let ci=-1,md=Infinity;
    this.bodies.forEach((b,i)=>{
      if(b.fixed) return;
      const d=Math.hypot(b.x-x,b.y-y);
      if(d<md){md=d;ci=i;}
    });
    if(ci>=0) this.bodies.splice(ci,1);
  },
  update(){
    const dt=1/60;
    const G=this.G;

    for(let i=0;i<this.bodies.length;i++){
      const a=this.bodies[i];
      if(a.fixed) continue;
      let ax=0,ay=0;
      for(let j=0;j<this.bodies.length;j++){
        if(i===j) continue;
        const b=this.bodies[j];
        const dx=b.x-a.x, dy=b.y-a.y;
        const dist2=dx*dx+dy*dy;
        if(dist2<100) continue;
        const dist=Math.sqrt(dist2);
        const f=G*b.m/dist2;
        ax+=f*dx/dist; ay+=f*dy/dist;
      }
      a.vx+=ax*dt; a.vy+=ay*dt;
    }

    this.bodies.forEach(b=>{
      if(!b.fixed){ b.x+=b.vx*dt; b.y+=b.vy*dt; }
      if(this.trails){
        b.trail.push({x:b.x,y:b.y});
        if(b.trail.length>300) b.trail.shift();
      }
      // Bounce at edges
      if(!b.fixed){
        if(b.x<0||b.x>W) b.vx*=-0.8;
        if(b.y<0||b.y>H) b.vy*=-0.8;
        b.x=clamp(b.x,0,W); b.y=clamp(b.y,0,H);
      }
    });

    // Check merges
    for(let i=0;i<this.bodies.length;i++){
      for(let j=i+1;j<this.bodies.length;j++){
        const a=this.bodies[i],b=this.bodies[j];
        if(Math.hypot(a.x-b.x,a.y-b.y) < a.r+b.r && !a.fixed && !b.fixed){
          // Merge into i
          a.vx=(a.vx*a.m+b.vx*b.m)/(a.m+b.m);
          a.vy=(a.vy*a.m+b.vy*b.m)/(a.m+b.m);
          a.m+=b.m; a.r=Math.cbrt(a.m)*1.5;
          this.bodies.splice(j,1); j--;
        }
      }
    }
  },
  draw(){
    // Trails
    this.bodies.forEach(b=>{
      if(b.trail.length<2) return;
      ctx.save();
      for(let i=1;i<b.trail.length;i++){
        const t=i/b.trail.length;
        ctx.beginPath();
        ctx.moveTo(b.trail[i-1].x,b.trail[i-1].y);
        ctx.lineTo(b.trail[i].x,b.trail[i].y);
        ctx.strokeStyle=b.color.replace('1)',''+t*0.5+')');
        ctx.lineWidth=t*2;
        ctx.shadowColor=b.color; ctx.shadowBlur=t*4;
        ctx.stroke();
      }
      ctx.restore();
    });

    // Gravity field lines (around star)
    const star=this.bodies[0];
    if(star){
      for(let a=0;a<12;a++){
        const ang=(a/12)*TAU;
        ctx.save();
        ctx.strokeStyle='rgba(255,220,50,0.06)';
        ctx.lineWidth=1;
        ctx.setLineDash([2,8]);
        ctx.beginPath();
        ctx.moveTo(star.x,star.y);
        ctx.lineTo(star.x+Math.cos(ang)*400, star.y+Math.sin(ang)*400);
        ctx.stroke();
        ctx.restore();
      }
    }

    // Bodies
    this.bodies.forEach(b=>{
      drawBall(b.x,b.y,b.r,b.color);
      if(b.fixed){
        // Corona
        for(let i=0;i<3;i++){
          const angle=(simTime*0.5+i*2.1)%TAU;
          ctx.save();
          ctx.beginPath();ctx.arc(b.x,b.y,b.r*2.5,angle,angle+0.8);
          ctx.strokeStyle='rgba(255,220,50,0.15)';
          ctx.lineWidth=6;ctx.stroke();ctx.restore();
        }
      }
    });
  },
  getCount(){return this.bodies.length;},
  getOverlay(){
    const ke=this.bodies.reduce((s,b)=>s+0.5*b.m*(b.vx**2+b.vy**2),0);
    return `<span class="label">SIM</span> N-Body Gravity<br><span class="label">G</span> ${this.G}<br><span class="label">N</span> ${this.bodies.length}<br><span class="label">KE</span> ${Math.round(ke)}<br><span class="label">MERGES</span> ON`;
  },
  buildPanel(){
    return `
    <div class="panel-section">
      <div class="panel-title">▸ Gravity</div>
      <div class="control"><label>G Constant <span id="gc">${this.G}</span></label><input type="range" min="500" max="20000" value="6000" oninput="orbitSim.G=+this.value;document.getElementById('gc').textContent=this.value"></div>
      <div class="control"><label>Star Mass <span id="sm">5000</span></label><input type="range" min="500" max="20000" value="5000" oninput="if(orbitSim.bodies[0]) orbitSim.bodies[0].m=+this.value;document.getElementById('sm').textContent=this.value"></div>
    </div>
    <div class="panel-section">
      <div class="panel-title">▸ Actions</div>
      <button class="action-btn primary" onclick="orbitSim.bodies.forEach(b=>b.trail=[])">Clear Trails</button>
      <button class="action-btn" onclick="orbitSim.trails=!orbitSim.trails;this.textContent=orbitSim.trails?'Hide Trails':'Show Trails'">Hide Trails</button>
      <button class="action-btn" onclick="orbitSim.bodies.filter(b=>!b.fixed).forEach(b=>{b.vx*=1.1;b.vy*=1.1})">Boost All</button>
      <button class="action-btn" onclick="orbitSim.init()">Reset</button>
    </div>
    <div class="panel-section">
      <div class="panel-title">▸ Info</div>
      <div class="info-box">
        <b>Kepler's Laws</b><br>
        F = Gm₁m₂/r²<br>
        T² ∝ a³<br><br>
        Bodies merge on<br>collision. Click to<br>add new planets.<br><br>
        Right-click removes.
      </div>
    </div>`;
  }
};

function switchSim(name){
  simTime=0;
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('active', b.textContent.toLowerCase()===name||
      (name==='gravity'&&b.textContent==='Gravity')||
      (name==='pendulum'&&b.textContent==='Pendulum')||
      (name==='waves'&&b.textContent==='Waves')||
      (name==='gas'&&b.textContent==='Gas')||
      (name==='orbit'&&b.textContent==='Orbits')
    );
  });
  currentSim = sims[name];
  currentSim.init();
  document.getElementById('panel').innerHTML = currentSim.buildPanel();

  const hints={
    gravity:'Click to spawn ball • Right-click to remove nearest',
    pendulum:'Click to add pendulum • Right-click to remove',
    waves:'Click to add wave source • Right-click to remove',
    gas:'Click to add particle • Right-click to remove',
    orbit:'Click to add planet • Right-click to remove • Bodies merge on collision'
  };
  document.getElementById('hint').textContent = hints[name];
}

switchSim('gravity');
loop();
</script>
